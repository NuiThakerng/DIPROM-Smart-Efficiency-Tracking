<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Product Management</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

      background: #f4f6f8;

      color: #222;

    }


    /* ======================================================
       HEADER
       ====================================================== */

    header {

      background: #1f4e78;

      color: white;

      padding: 18px 20px;

      text-align: center;

    }


    header h1 {

      margin: 0;

      font-size: 24px;

    }


    header p {

      margin: 6px 0 0;

      font-size: 14px;

      opacity: 0.9;

    }


    /* ======================================================
       CONTAINER
       ====================================================== */

    .container {

      max-width: 1000px;

      margin: 25px auto;

      padding: 0 15px;

    }


    /* ======================================================
       CARD
       ====================================================== */

    .card {

      background: white;

      border-radius: 12px;

      padding: 20px;

      margin-bottom: 20px;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.08);

    }


    .card h2 {

      margin-top: 0;

      color: #1f4e78;

      font-size: 20px;

    }


    /* ======================================================
       FORM
       ====================================================== */

    .form-row {

      display: grid;

      grid-template-columns: 1fr auto;

      gap: 10px;

    }


    input {

      width: 100%;

      padding: 12px;

      border:
        1px solid #ccc;

      border-radius: 8px;

      font-size: 16px;

      outline: none;

    }


    input:focus {

      border-color: #1f4e78;

    }


    /* ======================================================
       BUTTON
       ====================================================== */

    button {

      border: none;

      border-radius: 8px;

      padding: 11px 18px;

      font-size: 15px;

      cursor: pointer;

      transition: 0.2s;

    }


    button:hover {

      opacity: 0.9;

    }


    button:disabled {

      opacity: 0.5;

      cursor: not-allowed;

    }


    .btn-primary {

      background: #1f4e78;

      color: white;

    }


    .btn-edit {

      background: #f0ad4e;

      color: white;

    }


    .btn-delete {

      background: #d9534f;

      color: white;

    }


    .btn-activate {

      background: #198754;

      color: white;

    }


    .btn-cancel {

      background: #777;

      color: white;

    }


    /* ======================================================
       MESSAGE
       ====================================================== */

    .message {

      margin-top: 12px;

      padding: 12px;

      border-radius: 8px;

      display: none;

    }


    .success {

      background: #dff0d8;

      color: #3c763d;

    }


    .error {

      background: #f2dede;

      color: #a94442;

    }


    /* ======================================================
       TABLE
       ====================================================== */

    .table-wrapper {

      overflow-x: auto;

    }


    table {

      width: 100%;

      border-collapse: collapse;

      min-width: 700px;

    }


    th,
    td {

      border-bottom:
        1px solid #ddd;

      padding: 12px 10px;

      text-align: left;

      vertical-align: middle;

    }


    th {

      background: #eef3f7;

      color: #1f4e78;

    }


    tr:hover {

      background: #fafafa;

    }


    /* ======================================================
       STATUS
       ====================================================== */

    .status-active {

      color: #198754;

      font-weight: bold;

    }


    .status-inactive {

      color: #999;

      font-weight: bold;

    }


    /* ======================================================
       ACTION
       ====================================================== */

    .action-buttons {

      display: flex;

      gap: 6px;

      flex-wrap: wrap;

    }


    /* ======================================================
       EDIT BOX
       ====================================================== */

    .edit-box {

      display: none;

      margin-top: 12px;

      padding: 15px;

      background: #f8f9fa;

      border-radius: 8px;

      border:
        1px solid #ddd;

    }


    .edit-box label {

      display: block;

      margin-bottom: 6px;

      font-weight: bold;

    }


    .edit-buttons {

      margin-top: 10px;

      display: flex;

      gap: 8px;

    }


    /* ======================================================
       LOADING
       ====================================================== */

    .loading {

      text-align: center;

      padding: 20px;

      color: #777;

    }


    /* ======================================================
       EMPTY
       ====================================================== */

    .empty {

      text-align: center;

      padding: 25px;

      color: #777;

    }


    /* ======================================================
       MOBILE
       ====================================================== */

    @media (max-width: 600px) {

      header h1 {

        font-size: 20px;

      }


      .container {

        margin-top: 15px;

      }


      .card {

        padding: 15px;

      }


      .form-row {

        grid-template-columns: 1fr;

      }


      .form-row button {

        width: 100%;

      }


      button {

        padding: 10px 14px;

      }

    }

  </style>

</head>


<body>


<!-- ========================================================
     HEADER
     ======================================================== -->

<header>

  <h1>
    PRODUCTION EFFICIENCY TRACKER
  </h1>

  <p>
    Product Management
  </p>

</header>


<div class="container">


  <!-- ======================================================
       ADD PRODUCT
       ====================================================== -->

  <div class="card">

    <h2>
      ➕ เพิ่มสินค้า
    </h2>


    <div class="form-row">

      <input
        type="text"
        id="productName"
        placeholder="กรอกชื่อสินค้า"
        maxlength="200"
        autocomplete="off"
      >


      <button
        id="addButton"
        class="btn-primary"
        onclick="addProduct()"
      >

        ➕ เพิ่มสินค้า

      </button>

    </div>


    <div
      id="addMessage"
      class="message"
    ></div>

  </div>



  <!-- ======================================================
       PRODUCT LIST
       ====================================================== -->

  <div class="card">

    <h2>
      📋 รายการสินค้า
    </h2>


    <div
      id="loading"
      class="loading"
    >

      กำลังโหลดข้อมูล...

    </div>


    <div class="table-wrapper">

      <table
        id="productTable"
        style="display:none;"
      >

        <thead>

          <tr>

            <th>
              Product ID
            </th>

            <th>
              ชื่อสินค้า
            </th>

            <th>
              สถานะ
            </th>

            <th>
              จัดการ
            </th>

          </tr>

        </thead>


        <tbody
          id="productTableBody"
        >

        </tbody>

      </table>

    </div>

  </div>


</div>



<script>


  // ==========================================================
  // API URL
  // ==========================================================

  const API_URL =
    "https://script.google.com/macros/s/AKfycbx_zRo05cpH_Fl488sgUCMC18U0ziSDJM_ytcSGSWsM-RYD5wqw54M0MNdpG6YvmG4Y/exec";


  // ==========================================================
  // GLOBAL
  // ==========================================================

  let products = [];



  // ==========================================================
  // MESSAGE
  // ==========================================================

  function showMessage(
    elementId,
    message,
    type
  ) {

    const element =
      document.getElementById(
        elementId
      );


    element.textContent =
      message;


    element.className =
      "message " + type;


    element.style.display =
      "block";

  }


  function hideMessage(
    elementId
  ) {

    const element =
      document.getElementById(
        elementId
      );


    element.style.display =
      "none";

  }



  // ==========================================================
  // LOAD PRODUCTS
  // ==========================================================

  async function loadProducts() {

    const loading =
      document.getElementById(
        "loading"
      );


    const table =
      document.getElementById(
        "productTable"
      );


    try {

      loading.style.display =
        "block";


      table.style.display =
        "none";


      const response =
        await fetch(
          API_URL +
          "?action=allProducts"
        );


      if (!response.ok) {

        throw new Error(
          "HTTP Error " +
          response.status
        );

      }


      const data =
        await response.json();


      if (!data.success) {

        throw new Error(
          data.message ||
          "ไม่สามารถโหลดข้อมูลสินค้าได้"
        );

      }


      products =
        data.products || [];


      renderProducts();


      loading.style.display =
        "none";


      table.style.display =
        "table";


    } catch (error) {

      loading.textContent =
        "เกิดข้อผิดพลาด: " +
        error.message;

    }

  }



  // ==========================================================
  // RENDER PRODUCTS
  // ==========================================================

  function renderProducts() {

    const tbody =
      document.getElementById(
        "productTableBody"
      );


    tbody.innerHTML = "";


    if (
      products.length === 0
    ) {

      tbody.innerHTML = `

        <tr>

          <td
            colspan="4"
            class="empty"
          >

            ยังไม่มีข้อมูลสินค้า

          </td>

        </tr>

      `;

      return;

    }


    products.forEach(
      function(product) {


        const tr =
          document.createElement(
            "tr"
          );


        const status =
          String(
            product.status || ""
          ).trim();


        const statusClass =
          status === "Active"
            ? "status-active"
            : "status-inactive";


        const statusText =
          status === "Active"
            ? "Active"
            : "Inactive";


        tr.innerHTML = `

          <td>
            ${escapeHtml(
              product.productId
            )}
          </td>


          <td>
            ${escapeHtml(
              product.productName
            )}
          </td>


          <td
            class="${statusClass}"
          >
            ${statusText}
          </td>


          <td>

            <div class="action-buttons">


              <!-- EDIT -->

              <button
                class="btn-edit"
                onclick="editProduct(
                  '${escapeJs(
                    product.productId
                  )}'
                )"
              >

                ✏️ แก้ไข

              </button>


              <!-- ACTIVE -->

              ${
                status === "Active"

                ?

                `

                  <button
                    class="btn-delete"
                    onclick="deleteProduct(
                      '${escapeJs(
                        product.productId
                      )}'
                    )"
                  >

                    🗑️ ปิดใช้งาน

                  </button>

                `

                :

                `

                  <button
                    class="btn-activate"
                    onclick="activateProduct(
                      '${escapeJs(
                        product.productId
                      )}'
                    )"
                  >

                    ▶️ เปิดใช้งาน

                  </button>

                `

              }

            </div>


            <!-- EDIT BOX -->

            <div
              id="edit-${escapeHtml(
                product.productId
              )}"
              class="edit-box"
            >


              <label>

                ชื่อสินค้า

              </label>


              <input
                type="text"
                id="input-${escapeHtml(
                  product.productId
                )}"
                value="${escapeHtml(
                  product.productName
                )}"
                maxlength="200"
              >


              <div
                class="edit-buttons"
              >

                <button
                  class="btn-primary"
                  onclick="saveProduct(
                    '${escapeJs(
                      product.productId
                    )}'
                  )"
                >

                  💾 บันทึก

                </button>


                <button
                  class="btn-cancel"
                  onclick="cancelEdit(
                    '${escapeJs(
                      product.productId
                    )}'
                  )"
                >

                  ยกเลิก

                </button>

              </div>

            </div>

          </td>

        `;


        tbody.appendChild(
          tr
        );

      }
    );

  }



  // ==========================================================
  // ADD PRODUCT
  // ==========================================================

  async function addProduct() {

    hideMessage(
      "addMessage"
    );


    const input =
      document.getElementById(
        "productName"
      );


    const button =
      document.getElementById(
        "addButton"
      );


    const productName =
      input.value.trim();


    // --------------------------------------------------------
    // Validation
    // --------------------------------------------------------

    if (!productName) {

      showMessage(
        "addMessage",
        "กรุณากรอกชื่อสินค้า",
        "error"
      );

      input.focus();

      return;

    }


    // --------------------------------------------------------
    // Confirmation
    // --------------------------------------------------------

    if (
      !confirm(
        "ต้องการเพิ่มสินค้า\n\n" +
        productName +
        "\n\nใช่หรือไม่?"
      )
    ) {

      return;

    }


    try {

      button.disabled =
        true;


      button.textContent =
        "กำลังบันทึก...";


      const data =
        await postData({

          action:
            "addProduct",

          productName:
            productName

        });


      if (!data.success) {

        throw new Error(
          data.message ||
          "ไม่สามารถเพิ่มสินค้าได้"
        );

      }


      showMessage(
        "addMessage",

        "เพิ่มสินค้าเรียบร้อยแล้ว " +
        "Product ID: " +
        data.productId,

        "success"
      );


      input.value = "";


      await loadProducts();


    } catch (error) {

      showMessage(
        "addMessage",

        error.message,

        "error"
      );

    } finally {

      button.disabled =
        false;


      button.textContent =
        "➕ เพิ่มสินค้า";

    }

  }



  // ==========================================================
  // EDIT PRODUCT
  // ==========================================================

  function editProduct(
    productId
  ) {

    const box =
      document.getElementById(
        "edit-" +
        productId
      );


    if (!box) {

      return;

    }


    box.style.display =
      "block";


    const input =
      document.getElementById(
        "input-" +
        productId
      );


    if (input) {

      input.focus();

      input.select();

    }

  }



  // ==========================================================
  // CANCEL EDIT
  // ==========================================================

  function cancelEdit(
    productId
  ) {

    const box =
      document.getElementById(
        "edit-" +
        productId
      );


    if (box) {

      box.style.display =
        "none";

    }

  }



  // ==========================================================
  // SAVE PRODUCT
  // ==========================================================

  async function saveProduct(
    productId
  ) {

    const input =
      document.getElementById(
        "input-" +
        productId
      );


    if (!input) {

      alert(
        "ไม่พบช่องแก้ไขสินค้า"
      );

      return;

    }


    const productName =
      input.value.trim();


    if (!productName) {

      alert(
        "กรุณากรอกชื่อสินค้า"
      );

      input.focus();

      return;

    }


    if (
      !confirm(
        "ต้องการแก้ไขชื่อสินค้าเป็น\n\n" +
        productName +
        "\n\nใช่หรือไม่?"
      )
    ) {

      return;

    }


    try {

      const data =
        await postData({

          action:
            "updateProduct",

          productId:
            productId,

          productName:
            productName

        });


      if (!data.success) {

        throw new Error(
          data.message ||
          "ไม่สามารถแก้ไขสินค้าได้"
        );

      }


      alert(
        "แก้ไขสินค้าเรียบร้อยแล้ว"
      );


      await loadProducts();


    } catch (error) {

      alert(
        "เกิดข้อผิดพลาด\n\n" +
        error.message
      );

    }

  }



  // ==========================================================
  // DELETE / DEACTIVATE PRODUCT
  // ==========================================================

  async function deleteProduct(
    productId
  ) {

    const product =
      products.find(
        function(p) {

          return (
            p.productId ===
            productId
          );

        }
      );


    if (!product) {

      alert(
        "ไม่พบข้อมูลสินค้า"
      );

      return;

    }


    if (
      !confirm(
        "ต้องการปิดใช้งานสินค้า\n\n" +
        product.productName +
        "\n\nใช่หรือไม่?"
      )
    ) {

      return;

    }


    try {

      const data =
        await postData({

          action:
            "deleteProduct",

          productId:
            productId

        });


      if (!data.success) {

        throw new Error(
          data.message ||
          "ไม่สามารถปิดใช้งานสินค้าได้"
        );

      }


      alert(
        "ปิดใช้งานสินค้าเรียบร้อยแล้ว"
      );


      await loadProducts();


    } catch (error) {

      alert(
        "เกิดข้อผิดพลาด\n\n" +
        error.message
      );

    }

  }



  // ==========================================================
  // ACTIVATE PRODUCT
  // ==========================================================

  async function activateProduct(
    productId
  ) {

    const product =
      products.find(
        function(p) {

          return (
            p.productId ===
            productId
          );

        }
      );


    if (!product) {

      alert(
        "ไม่พบข้อมูลสินค้า"
      );

      return;

    }


    if (
      !confirm(
        "ต้องการเปิดใช้งานสินค้า\n\n" +
        product.productName +
        "\n\nใช่หรือไม่?"
      )
    ) {

      return;

    }


    try {

      const data =
        await postData({

          action:
            "activateProduct",

          productId:
            productId

        });


      if (!data.success) {

        throw new Error(
          data.message ||
          "ไม่สามารถเปิดใช้งานสินค้าได้"
        );

      }


      alert(
        "เปิดใช้งานสินค้าเรียบร้อยแล้ว"
      );


      await loadProducts();


    } catch (error) {

      alert(
        "เกิดข้อผิดพลาด\n\n" +
        error.message
      );

    }

  }



  // ==========================================================
  // POST API
  // ==========================================================

  async function postData(
    payload
  ) {

    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP Error " +
        response.status
      );

    }


    const data =
      await response.json();


    return data;

  }



  // ==========================================================
  // ESCAPE HTML
  // ==========================================================

  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }



  // ==========================================================
  // ESCAPE JAVASCRIPT
  // ==========================================================

  function escapeJs(
    value
  ) {

    return String(
      value ?? ""
    )
      .replace(
        /\\/g,
        "\\\\"
      )
      .replace(
        /'/g,
        "\\'"
      );

  }



  // ==========================================================
  // ENTER KEY
  // ==========================================================

  document
    .getElementById(
      "productName"
    )
    .addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          addProduct();

        }

      }
    );



  // ==========================================================
  // INITIAL LOAD
  // ==========================================================

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      loadProducts();

    }
  );


</script>


</body>

</html>
